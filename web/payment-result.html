<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONEPOINT · 결제 결과 확인</title></head>
<body style="background:#0d0f12;color:white;font-family:system-ui;padding:32px"><p>결제 결과를 서버에서 확인할 화면으로 이동합니다.</p><a id="return" style="color:#38bdf8">앱으로 돌아가기</a>
<script>
'use strict';
const params=new URLSearchParams(location.search), filtered=new URLSearchParams();
for(const key of ['paymentId','paymentKey','orderId','amount','code'])if(params.has(key))filtered.set(key,params.get(key));
const target=params.get('mobile')==='1'?'onepoint://payment-result?'+filtered:location.origin+'/#/payment-result?'+filtered;
document.getElementById('return').href=target;location.replace(target);
</script></body></html>
