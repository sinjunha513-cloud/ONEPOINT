<body>
  <script>
    // Remove caches left by older Flutter Web builds before loading the app.
    // An active legacy service worker can otherwise keep serving an obsolete
    // main.dart.js even after Firebase Hosting has received a new release.
    (async () => {
      const cleanupKey = 'onepoint-web-cache-cleanup-v7';
      let hadLegacyWorker = false;

      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        hadLegacyWorker = registrations.length > 0 || !!navigator.serviceWorker.controller;
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }

      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
      }

      if (hadLegacyWorker && !sessionStorage.getItem(cleanupKey)) {
        sessionStorage.setItem(cleanupKey, 'done');
        const refreshedUrl = new URL(window.location.href);
        refreshedUrl.searchParams.set('appVersion', '20261111-reels-video-delete-v4');
        window.location.replace(refreshedUrl.toString());
        return;
      }

      sessionStorage.removeItem(cleanupKey);
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=20261111-reels-video-delete-v4';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
