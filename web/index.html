<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="원포인트에서 스포츠 코치를 만나 레슨을 신청하고, 플레이 영상을 공유하고, 시그니처 뱃지를 모아 보세요.">
  <meta name="theme-color" content="#070101">
  <meta property="og:title" content="ONEPOINT · 원포인트 레슨">
  <meta property="og:description" content="나에게 맞는 코치와 레슨, 플레이 영상, 나만의 시그니처 뱃지.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ONEPOINT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- 💡 ico 및 png 호환성 캐시 방지 적용 -->
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3"/>
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <!-- 💡 브라우저 탭 이름 -->
  <title>ONEPOINT</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  
  <!-- 초기 로딩 스타일 설정 -->
  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #070101;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%; 
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%; 
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%; 
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
    #app-loading {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; padding: 28px; box-sizing: border-box;
      color: #fff; background: #070101;
      font-family: system-ui, -apple-system, sans-serif; text-align: center;
    }
    #app-loading[hidden] { display: none; }
    .loading-brand { font-size: 32px; font-weight: 700; letter-spacing: -1.5px; }
    .loading-brand span { color: #24a9ff; }
    #loading-message { color: #b9b9b9; font-size: 14px; line-height: 1.6; margin: 0; }
    #startup-retry { border: 0; border-radius: 14px; padding: 14px 24px;
      font: inherit; font-weight: 600; color: #000; background: #c7f000; cursor: pointer; }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
    }
    window.onepointStartup = (() => {
      let ready = false;
      const fail = () => {
        if (ready) return;
        const message = document.getElementById('loading-message');
        if (message) message.textContent = '화면을 불러오지 못했어요. 연결 상태를 확인하고 다시 시도해 주세요.';
        const retry = document.getElementById('startup-retry');
        if (retry) retry.hidden = false;
      };
      const timer = setTimeout(fail, 30000);
      window.addEventListener('flutter-first-frame', () => {
        ready = true; clearTimeout(timer);
        document.getElementById('app-loading')?.remove();
      }, {once: true});
      window.addEventListener('error', fail);
      window.addEventListener('unhandledrejection', fail);
      return {fail, retry() {
        const url = new URL(window.location.href);
        url.searchParams.set('appVersion', '20261119-mobile-startup-v2');
        url.searchParams.set('render', 'compat');
        window.location.replace(url.toString());
      }};
    })();
  </script>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-brand">one<span>•</span>point</div>
    <p id="loading-message">ONEPOINT를 불러오는 중이에요.</p>
    <button id="startup-retry" hidden onclick="window.onepointStartup.retry()">다시 시도</button>
  </div>
  <script src="flutter_bootstrap.js?v=20261119-mobile-startup-v2" async onerror="window.onepointStartup.fail()"></script>
</body>
</html>
