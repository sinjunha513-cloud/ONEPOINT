name: onepoint_lesson
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.0.0
  video_player: ^2.8.2
  image_picker: ^1.1.2
  provider: ^6.1.1
  http: ^1.2.0
  intl: ^0.19.0
  cloud_functions: 4.7.6
  url_launcher: 6.3.0
  app_links: 6.4.1
  file_picker: ^8.0.7
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  web: 0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_cloud_firestore: ^2.5.2
  firebase_auth_mocks: ^0.13.0

flutter:
  uses-material-design: true

  # 에셋 폴더 경로 설정 (icon 및 icons 경로 추가)
  assets:
    - assets/
